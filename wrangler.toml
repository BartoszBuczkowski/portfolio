name = "portfolio"
main = ".open-next/worker.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Public vars for Worker runtime (sitemap, canonical, OG). Use apex URL; redirect www in Cloudflare.
[vars]
NEXT_PUBLIC_SITE_URL = "https://bartoszbuczkowski.pl"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "portfolio"

[[d1_databases]]
binding = "portfolio_db"
database_name = "portfolio-db"
database_id = "8303ee89-c1aa-41d2-831b-c5e58baa66ba"
migrations_dir = "migrations"
